apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: astro-app-build
  namespace: astro-app
  labels:
    app.kubernetes.io/instance: astro-app
    backstage.io/kubernetes-id: astro-app
spec:
  params:
    - name: git-url
      type: string
      default: https://github.com/ultraJeffOrg/astro-app.git
    - name: git-revision
      type: string
      default: main
    - name: image
      type: string
      default: quay.io/ultraJeffOrg/astro-app:latest
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: ClusterTask
          - name: name
            value: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: source

    - name: build-app
      runAfter: [clone]
      taskSpec:
        metadata: {}
        spec: null
        workspaces:
          - name: source
        steps:
          - name: npm-install
            computeResources: {}
            image: registry.access.redhat.com/ubi9/nodejs-22:latest
            workingDir: $(workspaces.source.path)
            script: |
              npm ci
              npm run build
      workspaces:
        - name: source
          workspace: source

    - name: build-image
      runAfter: [build-app]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: ClusterTask
          - name: name
            value: buildah
      params:
        - name: IMAGE
          value: $(params.image)
      workspaces:
        - name: source
          workspace: source
